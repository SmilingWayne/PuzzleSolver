[pytest]
# Pytest 8 defaults to importlib mode which requires test packages to be importable
# as modules (e.g. "tests.test_xxx"). This repo's tests are plain files, so use
# prepend mode for stable collection/import behavior.
addopts = --import-mode=prepend

# Ensure "import puzzlekit" works without requiring an editable install.
pythonpath = src

# Skip vendored/optional external projects that have extra dependencies.
norecursedirs = penpa_edit

testpaths = tests

